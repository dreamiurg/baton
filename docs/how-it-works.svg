<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" role="img" aria-label="How baton brings a session: fork the transcript, send a resume link to this window, Desktop imports it">
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#6B6964" stroke-width="1.6"/></marker></defs>
  <rect width="880" height="330" rx="14" fill="#FAF9F5"/>
  <g>
    <rect x="30" y="40" width="230" height="110" rx="10" fill="#FCF1DE" stroke="#E7C28A"/>
    <text x="145" y="72" text-anchor="middle" font-size="15" font-weight="600" fill="#5C3306">Work window</text>
    <text x="145" y="96" text-anchor="middle" font-size="13" fill="#8A4B08">weekly limit reached</text>
    <text x="145" y="120" text-anchor="middle" font-size="12" fill="#8A4B08">session stalls</text>
  </g>
  <g>
    <rect x="620" y="40" width="230" height="110" rx="10" fill="#E7EEFC" stroke="#9DB8EE"/>
    <text x="735" y="72" text-anchor="middle" font-size="15" font-weight="600" fill="#123A86">Personal window</text>
    <text x="735" y="96" text-anchor="middle" font-size="13" fill="#1E4FAF">has quota</text>
    <text x="735" y="120" text-anchor="middle" font-size="12" fill="#1E4FAF">you type /bring</text>
  </g>
  <g>
    <rect x="300" y="190" width="280" height="100" rx="10" fill="#FFFFFF" stroke="#D9D5CC"/>
    <text x="440" y="220" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1E1D">~/.claude/projects</text>
    <text x="440" y="244" text-anchor="middle" font-size="12" fill="#6B6964">transcripts shared by every window</text>
    <text x="440" y="266" text-anchor="middle" font-size="12" fill="#6B6964">baton forks one under a new id</text>
  </g>
  <path d="M200 150 L200 240 L296 240" fill="none" stroke="#6B6964" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="208" y="200" font-size="12" fill="#4A4842">1 · its transcript</text>
  <path d="M584 240 L680 240 L680 154" fill="none" stroke="#6B6964" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="595" y="200" font-size="12" fill="#4A4842">2 · claude://resume</text>
  <text x="595" y="216" font-size="12" fill="#4A4842">to this window only</text>
  <path d="M265 75 L612 75" fill="none" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="5 5"/>
  <text x="440" y="66" text-anchor="middle" font-size="12" fill="#6B6964">original stays untouched</text>
  <text x="440" y="118" text-anchor="middle" font-size="13" fill="#1D6B3A">3 · Desktop imports the copy: full history, this account's quota</text>
</svg>
