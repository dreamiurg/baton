name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc -p tsconfig.unit.json
      - run: npm run test:unit
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
